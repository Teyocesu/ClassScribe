# SwiftLint configuration for ClassScribe

included:
  - app/MeetingTranscriber/ClassScribeSources
  - app/MeetingTranscriber/ClassScribeTests
  - app/MeetingTranscriber/ProcessingIPCSources
  - app/MeetingTranscriber/DiarizationHelperSources
  - tools/audiotap/Sources
  - tools/audiotap/Tests

excluded:
  - FluidAudio
  - .build
  - app/MeetingTranscriber/.build
  - tools/audiotap/.build
  - tools/meeting-simulator/.build

opt_in_rules:
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discarded_notification_center_observer
  - empty_collection_literal
  - fatal_error_message
  - first_where
  - force_unwrapping
  - identical_operands
  - last_where
  - modifier_order
  - private_swiftui_state
  - sorted_imports
  - unhandled_throwing_task
  - unowned_variable_capture
  - weak_delegate

analyzer_rules:
  - unused_declaration
  # unused_import omitted: results differ between xcodebuild (CI) and swift build (local)
  # due to implicit framework linking in Xcode SDK. Run locally with scripts/lint.sh if needed.

disabled_rules:
  - trailing_comma        # Project convention — intentional trailing commas (99 occurrences)
  - todo                  # TODOs are tracked intentionally
  - closure_parameter_position # SwiftFormat's wrapping is authoritative.
  - for_where             # Explicit conditionals are clearer in cleanup/validation loops.
  - identifier_name       # Existing audio terminology and fixture names use short domain identifiers.

type_name:
  min_length:
    warning: 3
  max_length:
    warning: 50

line_length:
  warning: 160
  error: 250
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

file_length:
  warning: 1200
  error: 1600

type_body_length:
  warning: 1000
  error: 1400

function_body_length:
  warning: 120
  error: 180

function_parameter_count:
  warning: 8
  error: 10

cyclomatic_complexity:
  warning: 15
  error: 25

large_tuple:
  warning: 4
  error: 6

force_try:
  severity: warning

force_cast:
  severity: warning

force_unwrapping:
  severity: warning

nesting:
  type_level: 2
  function_level: 3
