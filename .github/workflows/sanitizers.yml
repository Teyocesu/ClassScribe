name: ClassScribe Sanitizers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizer:
    name: ${{ matrix.sanitizer }} sanitizer
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve fixed Swift packages
        run: swift package resolve --package-path app/MeetingTranscriber

      - name: ClassScribe tests
        run: >-
          swift test --package-path app/MeetingTranscriber -j 1 --no-parallel
          --sanitize ${{ matrix.sanitizer }}
          -Xswiftc -strict-concurrency=complete

      - name: AudioTap tests
        run: >-
          swift test --package-path tools/audiotap -j 1 --no-parallel
          --sanitize ${{ matrix.sanitizer }}
          -Xswiftc -strict-concurrency=complete
