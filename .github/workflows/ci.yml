name: ClassScribe CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classscribe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve fixed Swift packages
        run: swift package resolve --package-path app/MeetingTranscriber

      - name: SwiftPM Debug and Release builds
        run: |
          swift build --package-path app/MeetingTranscriber -c debug -j 2
          swift build --package-path app/MeetingTranscriber -c release -j 2

      - name: ClassScribe unit tests
        run: swift test --package-path app/MeetingTranscriber -j 2

      - name: AudioTap library tests
        run: swift test --package-path tools/audiotap -j 2

      - name: Xcode Debug and Release builds
        working-directory: app/MeetingTranscriber
        run: |
          xcodebuild -scheme ClassScribe -configuration Debug -destination 'platform=macOS' build
          xcodebuild -scheme ClassScribe -configuration Release -destination 'platform=macOS' build

      # Tests requiring TCC, audio hardware, CATap, or UI interaction remain
      # opt-in locally; no GitHub-hosted runner can authorize them reliably.
