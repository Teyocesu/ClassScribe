name: ClassScribe CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classscribe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-classscribe:
    name: macOS ClassScribe tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Toolchain and runner resources
        run: |
          xcodebuild -version
          swift --version
          sysctl -n hw.ncpu
          sysctl -n hw.memsize

      - name: Test ClassScribe with strict concurrency
        run: >-
          swift test --package-path app/MeetingTranscriber
          --enable-swift-testing --enable-xctest
          -Xswiftc -strict-concurrency=complete

      # Tests requiring TCC, audio hardware, CATap, or UI interaction remain
      # opt-in locally; no GitHub-hosted runner can authorize them reliably.

  macos-audiotap:
    name: macOS AudioTap tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Test AudioTap with strict concurrency
        run: >-
          swift test --package-path tools/audiotap
          --disable-swift-testing --enable-xctest
          -Xswiftc -strict-concurrency=complete

  windows:
    name: Windows build and tests
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/ClassScribe.Windows
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify preinstalled .NET SDK
        shell: pwsh
        run: |
          dotnet --list-sdks
          $resolvedSdk = [version](dotnet --version)
          Write-Host "Resolved SDK: $resolvedSdk"
          if ($resolvedSdk -lt [version]'10.0.302' -or $resolvedSdk -ge [version]'10.0.400') {
            throw "global.json resolved unsupported SDK $resolvedSdk"
          }

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore ClassScribe.Windows.slnx --locked-mode

      - name: Build and test
        shell: pwsh
        run: >-
          dotnet test ClassScribe.Windows.slnx
          --configuration Release
          --no-restore
