# The diagnostic-log export steps below are duplicated in feature-request.yml.
# Issue forms have no include mechanism, so a change to the export flow in the
# app has to be made in both files.
name: Bug Report
description: Report a bug in ClassScribe
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por informar el problema. No adjuntes audio, transcripciones,
        embeddings, logs completos ni crash reports: pueden contener datos
        privados. Incluye solamente pasos de reproducción y, si es necesario,
        un fragmento técnico previamente anonimizado.

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Copia la línea de build visible en la ventana principal.
      placeholder: "commit abcdef · 2026-08-06T12:00:00Z"
    validations:
      required: true

  - type: dropdown
    id: variant
    attributes:
      label: Build variant
      options:
        - Windows installer
        - Windows portable ZIP
        - macOS DMG
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11 x64
        - macOS Apple Silicon
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version/build
      placeholder: "Windows 11 build 26100 or macOS 15.6"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a Zoom meeting with two participants
        2. Click Record in the menu bar
        3. ...
    validations:
      required: true

  - type: textarea
    id: sanitized-details
    attributes:
      label: Sanitized technical details (optional)
      description: Never include audio, transcripts, private paths, full logs or crash reports.
    validations:
      required: false
